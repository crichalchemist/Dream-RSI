name: ci
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest,  python: "3.13" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: reconstruction
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: reconstruction/pyproject.toml
      - run: python -m pip install -e ".[extract,lasso,dev]"
      - run: ruff check . && ruff format --check .
      - run: pyright
      - run: python tools/extract_listings.py --check
      - run: python tools/extract_listings.py
      - run: python -m pytest -q --junitxml=report.xml
      - run: python tools/check_junit.py report.xml --expect 106
